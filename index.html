
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebProxy | Learning Project</title>
  <style>
    body {
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 15px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: #1d293b;
      padding: 30px;
      border-radius: 15px;
    }

    input {
      width: 85%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      margin: 15px 0;
    }

    button {
      background: #3978ed;
      color: white;
      padding: 13px 25px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #output {
      background: #101522;
      padding: 15px;
      margin-top: 20px;
      border-radius: 8px;
      text-align: left;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌐 WebProxy</h1>
    <p>Educational Proxy Simulator</p>

    <input id="url" placeholder="Enter a test website URL">
    <br>
    <button onclick="simulate()">Send Request</button>

    <div id="output">
      Ready to simulate a request.
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
